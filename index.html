<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>English Coach — Ali's Vocabulary</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#18202a;--muted:#687386;--accent:#315efb;--accent2:#e9efff;--border:#e5e8ef;--good:#16845b;--bad:#c43d3d;--shadow:0 12px 35px rgba(20,30,55,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
    .nav{max-width:1050px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:800;font-size:20px}.brand span{color:var(--accent)}
    .nav button{border:0;background:transparent;padding:9px 12px;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:600}.nav button.active,.nav button:hover{background:var(--accent2);color:var(--accent)}
    main{max-width:1050px;margin:0 auto;padding:30px 20px 60px}.view{display:none}.view.active{display:block}
    .hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.hero h1{margin:0 0 6px;font-size:34px}.hero p{margin:0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat b{font-size:28px;display:block}.stat small{color:var(--muted)}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
    .flashcard{min-height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}.word{font-size:50px;font-weight:850;margin:8px 0}.pos{color:var(--accent);font-weight:700}.hint{color:var(--muted);margin-top:14px}.answer{display:none;max-width:680px}.answer.show{display:block}.meaning{font-size:21px;font-weight:650;margin:14px 0 8px}.persian{font-size:19px}.example{background:var(--bg);padding:14px 16px;border-radius:12px;margin-top:15px;line-height:1.5}
    .actions{display:flex;justify-content:center;gap:12px;margin-top:16px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:750;cursor:pointer}.btn.primary{background:var(--accent);color:white}.btn.good{background:#e8f7f0;color:var(--good)}.btn.bad{background:#fdecec;color:var(--bad)}.btn.secondary{background:#eef1f6;color:var(--text)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.input{border:1px solid var(--border);border-radius:11px;padding:11px 13px;font:inherit;background:white;min-width:220px}.select{border:1px solid var(--border);border-radius:11px;padding:11px;background:white;font:inherit}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
    .tag{display:inline-block;background:var(--accent2);color:var(--accent);padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}
    .empty{text-align:center;color:var(--muted);padding:35px}
    @media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.hero{align-items:start;flex-direction:column}.nav{overflow:auto}.word{font-size:40px}.form{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="nav">
  <div class="brand">English <span>Coach</span></div>
  <div>
    <button class="navbtn active" data-view="review">Review</button>
    <button class="navbtn" data-view="words">My Words</button>
    <button class="navbtn" data-view="add">Add Word</button>
  </div>
</div></header>

<main>
<section id="review" class="view active">
  <div class="hero"><div><h1>Daily Review</h1><p>Tap the card to reveal the answer.</p></div><button class="btn secondary" id="shuffle">Shuffle</button></div>
  <div class="stats" id="stats"></div>
  <div class="panel flashcard" id="card">
    <div id="front"><div class="pos" id="cardPos"></div><div class="word" id="cardWord"></div><div class="hint">Tap to reveal</div></div>
    <div class="answer" id="back"><div class="meaning" id="cardMeaning"></div><div class="persian" id="cardPersian"></div><div class="example" id="cardExample"></div></div>
  </div>
  <div class="actions" id="reviewActions" style="display:none">
    <button class="btn bad" id="forgot">Forgot</button><button class="btn good" id="known">I knew it</button>
  </div>
</section>

<section id="words" class="view">
  <div class="hero"><div><h1>My Vocabulary</h1><p>Your personal English word bank.</p></div></div>
  <div class="panel">
    <div class="toolbar"><input class="input" id="search" placeholder="Search words..."><select class="select" id="filter"><option value="all">All categories</option><option>Everyday</option><option>Academic</option><option>Work & Interviews</option><option>Phrasal verbs</option><option>Idioms</option></select></div>
    <div id="wordTable"></div>
  </div>
</section>

<section id="add" class="view">
  <div class="hero"><div><h1>Add a Word</h1><p>Build vocabulary from the English you actually encounter.</p></div></div>
  <div class="panel">
    <form class="form" id="addForm">
      <input class="input" name="word" placeholder="English word or phrase" required>
      <input class="input" name="pos" placeholder="Part of speech (e.g. adjective)">
      <input class="input" name="meaning" placeholder="English definition" required>
      <input class="input" name="persian" placeholder="Persian meaning">
      <input class="input" name="category" placeholder="Category (e.g. Everyday)" value="Everyday">
      <input class="input" name="example" placeholder="Example sentence">
      <button class="btn primary full" type="submit">Add to my vocabulary</button>
    </form>
  </div>
</section>
</main>

<script>
const starter=[
 {word:"overwhelmed",pos:"adjective",meaning:"Feeling unable to cope because there is too much to deal with.",persian:"غرق در فشار / مستأصل",category:"Everyday",example:"I've been feeling overwhelmed by everything I have to deal with lately."},
 {word:"congestion",pos:"noun",meaning:"A situation in which a place or system is too crowded, especially with traffic.",persian:"ازدحام",category:"Academic",example:"The city introduced new measures to reduce traffic congestion."},
 {word:"feasible",pos:"adjective",meaning:"Possible and practical to do successfully.",persian:"امکان‌پذیر / عملی",category:"Academic",example:"We need to determine whether the proposed solution is feasible."},
 {word:"follow up",pos:"phrasal verb",meaning:"To take additional action after an earlier event or conversation.",persian:"پیگیری کردن",category:"Phrasal verbs",example:"I'll follow up with the hiring manager next week."},
 {word:"get the hang of",pos:"idiom",meaning:"To learn how to do something through practice.",persian:"راه و روش کاری را یاد گرفتن",category:"Idioms",example:"It took me a few days to get the hang of the new software."},
 {word:"articulate",pos:"verb",meaning:"To express an idea clearly and effectively.",persian:"شفاف بیان کردن",category:"Work & Interviews",example:"She was able to articulate her research goals very clearly."}
];
let words=JSON.parse(localStorage.getItem("englishCoachWords")||"null")||starter.map(x=>({...x,seen:0,known:0,forgot:0}));
let current=0,revealed=false;

function save(){localStorage.setItem("englishCoachWords",JSON.stringify(words))}
function renderStats(){
 const total=words.length, known=words.reduce((a,w)=>a+w.known,0), forgot=words.reduce((a,w)=>a+w.forgot,0);
 document.getElementById("stats").innerHTML=`<div class="stat"><b>${total}</b><small>Total words</small></div><div class="stat"><b>${words.filter(w=>w.known>0).length}</b><small>Practiced</small></div><div class="stat"><b>${known}</b><small>Known answers</small></div><div class="stat"><b>${forgot}</b><small>Needs review</small></div>`;
}
function showCard(){
 if(!words.length){document.getElementById("card").innerHTML='<div class="empty">No words yet. Add your first word.</div>';return}
 const w=words[current%words.length]; revealed=false;
 document.getElementById("front").style.display="block";document.getElementById("back").classList.remove("show");document.getElementById("reviewActions").style.display="none";
 document.getElementById("cardWord").textContent=w.word;document.getElementById("cardPos").textContent=w.pos||"";
 document.getElementById("cardMeaning").textContent=w.meaning;document.getElementById("cardPersian").textContent=w.persian||"";
 document.getElementById("cardExample").innerHTML="<strong>Example:</strong> "+(w.example||"");
}
document.getElementById("card").onclick=()=>{if(!words.length)return;revealed=true;document.getElementById("front").style.display="none";document.getElementById("back").classList.add("show");document.getElementById("reviewActions").style.display="flex";};
function grade(ok){let w=words[current%words.length];w.seen=(w.seen||0)+1;ok?w.known=(w.known||0)+1:w.forgot=(w.forgot||0)+1;save();renderStats();current=(current+1)%words.length;showCard();}
document.getElementById("known").onclick=()=>grade(true);document.getElementById("forgot").onclick=()=>grade(false);
document.getElementById("shuffle").onclick=()=>{current=Math.floor(Math.random()*words.length);showCard()};
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.view).classList.add("active");if(b.dataset.view==="words")renderTable()});
function renderTable(){
 const q=document.getElementById("search").value.toLowerCase(), f=document.getElementById("filter").value;
 const list=words.filter(w=>(w.word+" "+w.meaning).toLowerCase().includes(q)&&(f==="all"||w.category===f));
 document.getElementById("wordTable").innerHTML=list.length?`<table><thead><tr><th>Word</th><th>Meaning</th><th>Category</th><th>Practice</th></tr></thead><tbody>${list.map((w)=>`<tr><td><strong>${w.word}</strong><br><small>${w.pos||""}</small></td><td>${w.meaning}</td><td><span class="tag">${w.category}</span></td><td>${w.seen||0}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">No matching words.</div>';
}
document.getElementById("search").oninput=renderTable;document.getElementById("filter").onchange=renderTable;
document.getElementById("addForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);words.push({word:f.get("word").trim(),pos:f.get("pos").trim(),meaning:f.get("meaning").trim(),persian:f.get("persian").trim(),category:f.get("category").trim()||"Everyday",example:f.get("example").trim(),seen:0,known:0,forgot:0});save();renderStats();e.target.reset();e.target.category.value="Everyday";alert("Word added!");};
renderStats();showCard();
</script>
</body>
</html>
